name: Writing task / Задача по содержанию
description: Write a new content unit — text, formulas, illustrations, examples, data / Написать новую единицу содержания — текст, формулы, иллюстрации, примеры, данные
type: Writing
labels: ["status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, add a `content:*` label (content form) and, if needed, `lang:*`.

        После создания добавьте метку `content:*` (форма содержимого) и, если нужно, `lang:*`.
  - type: input
    id: unit
    attributes:
      label: Content unit / Единица содержания
      description: |-
        What needs to be created.

        Что нужно создать.
      placeholder: "e.g., “Chapter 5. General linear model: section on assumptions” / например, «Глава 5. Общая линейная модель: раздел о допущениях»"
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Outline or structure / План или структура
      description: |-
        Main parts, key ideas, examples to be covered.

        Основные части, ключевые идеи, примеры, которые нужно раскрыть.
  - type: textarea
    id: sources
    attributes:
      label: Sources and materials / Источники и материалы
      description: |-
        Literature, links, drafts, related issues.

        Литература, ссылки, черновики, связанные issues.
  - type: textarea
    id: links
    attributes:
      label: Link to learning outcomes / Связь с образовательными результатами
      description: |-
        Which learning outcomes this unit supports (if they are already formulated).

        Какие результаты обучения эта единица поддерживает (если они уже сформулированы).
  - type: textarea
    id: done
    attributes:
      label: Definition of done / Критерий готовности
      description: |-
        How to tell that the work is finished (length, checks, review, code runs, etc.).

        Как понять, что работа закончена (объём, проверки, рецензия, код запускается и т. п.).
    validations:
      required: true
