# Общие настройки выбора шаблонов issues для всех репозиториев организации wolm-sdarp.
# Действует там, где в самом репозитории нет своей папки .github/ISSUE_TEMPLATE.
# Спецификация: documentation/content/gh-issues-docs.md (§7).

# Пустые issues отключены: любая задача создаётся через форму и получает тип.
# Для задач «вне классификации» есть форма «Другое» (тип Task).
blank_issues_enabled: false

# Ссылка на Discussions для вопросов по материалу (вопрос — не issue).
# Раскомментируйте после включения Discussions в организации или нужном репозитории
# и при необходимости замените ссылку.
# contact_links:
#   - name: Вопрос по материалу
#     url: https://github.com/orgs/wolm-sdarp/discussions
#     about: Вопросы, обсуждения и идеи — в Discussions. Issue нужен, если в материале ошибка или его нужно изменить.
