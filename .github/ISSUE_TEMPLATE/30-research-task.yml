name: Research question / Исследовательский вопрос
description: Literature review, source verification, choosing an approach or package, technical spike / Обзор литературы, проверка источников, выбор подхода или пакета, технический spike
type: Research
labels: ["status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The result of such a task is knowledge or a decision, not a finished artifact.
        Based on the outcome of the research, separate tasks are created (Writing, Feature, Maintenance, etc.).

        Результат такой задачи — знание или решение, а не готовый артефакт.
        По итогам исследования заводятся отдельные задачи (Writing, Feature, Maintenance и др.).
  - type: textarea
    id: question
    attributes:
      label: Question / Вопрос
      description: |-
        What needs to be found out; the more precise the wording, the easier it is to finish the research.

        Что нужно выяснить; чем точнее формулировка, тем легче закончить исследование.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time limit / Ограничение по времени
      description: |-
        How much time may be spent before the result is recorded, whatever it is.

        Сколько времени можно потратить, прежде чем зафиксировать результат, каким бы он ни был.
      placeholder: "e.g., 2 work sessions / например, 2 рабочие сессии"
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Expected result / Ожидаемый результат
      description: |-
        In what form the answer is recorded and where it will be stored.

        В какой форме фиксируется ответ и где он будет храниться.
      placeholder: "e.g., a short review in documentation/drafts/ and a decision in an issue comment / например, краткий обзор в documentation/drafts/ и решение в комментарии к задаче"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and known sources / Контекст и известные источники
