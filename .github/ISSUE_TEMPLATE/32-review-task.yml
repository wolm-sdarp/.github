name: Задача по рецензированию
description: Организовать и провести научную, методическую, редакторскую или техническую рецензию
type: Review
labels: ["status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Форма описывает сам процесс рецензирования. Замечания рецензентов оформляйте отдельными задачами:
        формой «Ошибка в материале», если есть ошибка, и формой «Предложение по улучшению», если ошибки нет;
        добавляйте им метку `src:reviewer` и ссылайтесь на эту задачу.
        Если рецензентов несколько или идёт отдельный раунд, создайте Epic на раунд и добавьте эту задачу в него.
        После создания добавьте метку `channel:*`, если рецензируется опубликованная версия.
  - type: dropdown
    id: kind
    attributes:
      label: Вид рецензии
      options:
        - Научная (корректность содержания и статистики)
        - Методическая (образовательные результаты, задания, последовательность)
        - Редакторская (язык, стиль, терминология)
        - Техническая (сборка, код, отображение, доступность)
        - Комплексная
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Что рецензируется
      placeholder: "например, «Книга 1, главы 3–5» или «Блок заданий к главе 5»"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия для рецензирования
      description: Тег, коммит или канал публикации — зафиксированная версия, которую читает рецензент.
      placeholder: "например, v0.3.0-beta.1"
    validations:
      required: true
  - type: input
    id: reviewers
    attributes:
      label: Рецензенты
      description: Issues публичны, поэтому для внешних рецензентов указывайте только роль или имя, которое они разрешили раскрывать; контакты не указывайте.
  - type: textarea
    id: focus
    attributes:
      label: Вопросы и границы рецензии
      description: На что рецензенту смотреть в первую очередь, какие вопросы ему задаются и что находится вне рамок рецензии.
    validations:
      required: true
  - type: dropdown
    id: collection
    attributes:
      label: Как собираются замечания
      options:
        - Issues в репозитории
        - Аннотации (например, Hypothesis) с переносом в issues
        - Письмо или документ с переносом в issues
        - Другое (укажите в описании)
  - type: input
    id: window
    attributes:
      label: Срок рецензирования
      placeholder: "например, 3 недели с 2026-11-01"
  - type: textarea
    id: done
    attributes:
      label: Критерий завершения
      description: Например, все замечания получили ответ («исправлено» или «отклонено с причиной»), оформлены задачи, внесённые правки проверены.
    validations:
      required: true
