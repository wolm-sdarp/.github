name: Техническая проблема
description: Не собирается, неверно отображается, не срабатывает workflow, не запускается код
type: Bug
labels: ["status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Эта форма — для технических проблем (сборка, отображение, CI, публикация, код).
        Если неверен сам текст или содержание, выберите форму «Ошибка в материале».
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что нужно сделать, чтобы увидеть проблему.
      placeholder: |
        1. Склонировать репозиторий…
        2. Выполнить `quarto render`…
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что происходит на самом деле; приложите текст ошибки или скриншот.
    validations:
      required: true
  - type: input
    id: r-version
    attributes:
      label: Версия R
      placeholder: "например, 4.5.1"
  - type: input
    id: quarto-version
    attributes:
      label: Версия Quarto
      placeholder: "например, 1.8.25"
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - macOS
        - Windows
        - Linux
        - GitHub Actions
        - Другая
  - type: textarea
    id: session-info
    attributes:
      label: Результат sessionInfo()
      description: Для проблем с R-кодом и пакетами (при использовании renv — также статус `renv::status()`).
      render: text
  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
