name: Technical problem / Техническая проблема
description: Fails to build, renders incorrectly, a workflow does not trigger, code does not run / Не собирается, неверно отображается, не срабатывает workflow, не запускается код
type: Bug
labels: ["status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for technical problems (build, rendering, CI, publishing, code).
        If the text or content itself is wrong, choose the "Content mistake" form.

        Эта форма — для технических проблем (сборка, отображение, CI, публикация, код).
        Если неверен сам текст или содержание, выберите форму «Ошибка в материале».
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Шаги воспроизведения
      description: |-
        What to do to see the problem.

        Что нужно сделать, чтобы увидеть проблему.
      placeholder: |
        1. Clone the repository… / Склонировать репозиторий…
        2. Run `quarto render`… / Выполнить `quarto render`…
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Фактическое поведение
      description: |-
        What actually happens; attach the error text or a screenshot.

        Что происходит на самом деле; приложите текст ошибки или скриншот.
    validations:
      required: true
  - type: input
    id: r-version
    attributes:
      label: R version / Версия R
      placeholder: "e.g., 4.5.1 / например, 4.5.1"
  - type: input
    id: quarto-version
    attributes:
      label: Quarto version / Версия Quarto
      placeholder: "e.g., 1.8.25 / например, 1.8.25"
  - type: dropdown
    id: os
    attributes:
      label: Operating system / Операционная система
      options:
        - macOS
        - Windows
        - Linux
        - GitHub Actions
        - Other / Другая
  - type: textarea
    id: session-info
    attributes:
      label: sessionInfo() output / Результат sessionInfo()
      description: |-
        For problems with R code and packages (if you use renv, also the output of `renv::status()`).

        Для проблем с R-кодом и пакетами (при использовании renv — также статус `renv::status()`).
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context / Дополнительный контекст
