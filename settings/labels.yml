# Источник истины для меток (labels) организации wolm-sdarp.
# Спецификация: documentation/content/gh-issues-docs.md (§4).
# Применение:   python3 settings/apply-labels.py   (см. settings/README.md)
#
# Формат файла намеренно простой (скрипт читает его без сторонних библиотек):
#   - один уровень вложенности, без якорей и многострочных значений;
#   - строки и цвета — в двойных кавычках;
#   - списки — в одну строку: [a, b, c].

org: wolm-sdarp

# К какому набору относится репозиторий (набор определяет, какие метки в нём нужны; §4.3).
# Репозиторий, которого ещё нет в организации (например, manim), пропускается.
repo_sets:
  content: [book0, book1, assessment0, assessment1, annex]
  docs: [documentation]
  platform: [wolm-sdarp.github.io, .github, manim]

# Метки, которые создают сторонние инструменты (Dependabot); скрипт их не трогает.
ignore: [javascript, github_actions]

# Устаревшие метки: заменены типами задач, close reasons или Discussions (§10.2).
# Удаляются только с флагом --delete; перед удалением скрипт показывает, сколько задач на них ссылается.
delete: [bug, enhancement, enchancement, question]

# name         — имя метки (до 50 символов)
# color        — hex без решётки
# description  — до 100 символов, на английском
# sets         — в каких наборах репозиториев метка нужна
# aliases      — прежние имена: метка с таким именем будет переименована (история задач сохраняется)
# reserve      — true: метка создаётся заранее, но используется после выполнения условия включения (§4.5)
labels:
  # ---- ld: этапы образовательного проектирования -------------------------------------------
  - name: "ld:vision"
    color: "8957e5"
    description: "Global vision: goals, personas, jobs to be done, product canvas"
    sets: [content, docs]
    reserve: false
    aliases: []
  - name: "ld:competencies"
    color: "8957e5"
    description: "Competency profile"
    sets: [content, docs]
    reserve: false
    aliases: ["competences"]
  - name: "ld:outcomes"
    color: "8957e5"
    description: "Learning outcomes and their taxonomy levels (Bloom, SOLO, Fink)"
    sets: [content, docs]
    reserve: false
    aliases: []
  - name: "ld:assessment"
    color: "8957e5"
    description: "Assessment strategy and alignment with outcomes"
    sets: [content, docs]
    reserve: false
    aliases: []
  - name: "ld:content"
    color: "8957e5"
    description: "Content structure, sequencing and instructional events"
    sets: [content, docs]
    reserve: false
    aliases: []

  # ---- content: форма содержимого ----------------------------------------------------------
  - name: "content:text"
    color: "1f6feb"
    description: "Prose: explanations, examples, callouts"
    sets: [content]
    reserve: false
    aliases: []
  - name: "content:math"
